[project]
name = "langgraph-workflow-example"
version = "0.1.0"
description = "A simple LangGraph workflow example for teaching AI workflows"
authors = [{name = "Your Name", email = "you@example.com"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "langchain-openai>=0.1.0",
    "langgraph>=0.2.0",
    "typing-extensions>=4.0.0",
    "python-dotenv>=1.0.0",
    "rich>=15.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workflows"]
