[project]
name = "data-analyst-agent"
version = "0.1.0"
description = "Minimal LangGraph orchestration for DataAnalystAgent: data_cleaning_agent then EDAWorkflow"
readme = "README.md"
authors = [{ name = "Andres Vourakis" }]
requires-python = ">=3.10,<3.12"
dependencies = [
    "pandas>=2.0.0",
    "langgraph>=0.2.0,<0.3.0",
    "langchain>=0.3.0,<0.4.0",
    "langchain-openai>=0.2.0,<0.3.0",
    "python-dotenv>=1.0.0",
    "data-cleaning-agent",
    "eda-workflow",
]

[tool.uv.sources]
data-cleaning-agent = { path = "../data-cleaning-agent", editable = true }
eda-workflow = { path = "../eda-workflow", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_analyst_agent"]
