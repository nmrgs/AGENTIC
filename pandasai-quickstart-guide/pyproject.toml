[project]
name = "pandasai-introduction"
version = "0.1.0"
description = "PandasAI + Semantic Layer exploration for Future Proof Data Science Bootcamp"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "pandas>=2.0.3,<3.0.0",
    "numpy>=1.24.3,<2.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "psycopg2-binary>=2.9.0,<3.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "jupyter>=1.0.0,<2.0.0",
    "ipykernel>=6.0.0,<7.0.0",
    "matplotlib>=3.7.0,<4.0.0",
    "seaborn>=0.12.0,<0.13.0",
    "pandasai>=3.0.0,<4.0.0",
    "pandasai-litellm>=0.0.1,<0.0.2",
    "python-dotenv>=1.0.0,<2.0.0",
    "pandasai-sql>=0.1.7,<0.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.5,<0.7.0",
    "black>=24.8.0,<25.0.0",
]
